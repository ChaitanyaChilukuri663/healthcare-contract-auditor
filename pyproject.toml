[project]
name = "healthcare-contract-auditor"
version = "0.1.0"
description = "AI-powered healthcare contract auditing API: RAG extraction proposes, a deterministic SQL rules engine disposes."
readme = "README.md"
# Targets Python 3.12 (ruff + pyright below); runs fine on 3.12 or 3.13.
# Install with pip:  pip install -r requirements.txt   (dev tools: requirements-dev.txt)
# This [project].dependencies list mirrors requirements.txt and is kept for metadata.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "openai>=1.40",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "python-dotenv>=1",
    "httpx>=0.27",
    # Document extraction
    "pypdf>=4.0",
    "tiktoken>=0.7",
    # Azure services
    "azure-search-documents>=11.5",
    "azure-storage-blob>=12.20",
    "azure-identity>=1.17",
    "streamlit>=1.40",
    # Azure SQL (async)
    "aioodbc>=0.5",
    "pyodbc>=5.1",
    # Data processing / matching
    "pandas>=2.2",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
]

# Dev/test tools live in requirements-dev.txt (pip install -r requirements-dev.txt).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live tests hit real provider APIs and are skipped by default. Opt in with:
#   pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: test calls a real LLM provider API (needs network + credentials); skipped unless -m live",
]
